plugins {
	id("net.fabricmc.fabric-loom-remap") version("${fabric_loom_version}")
	id("maven-publish")
    id("me.modmuss50.mod-publish-plugin") version("${publisher_plugin_version}")
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)

    withSourcesJar()
    withJavadocJar()
}

repositories {
    exclusiveContent {
        forRepositories(
                maven {
                    name = "ParchmentMC Maven"
                    url = "https://maven.parchmentmc.org/"
                }
        )
        filter {
            includeGroup("org.parchmentmc.data")
        }
    }

    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }

    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
    }

    maven {
        name = "Meme Man Maven"
        url = "https://dl.cloudsmith.io/public/meme-man-mods/nexus/maven/"
    }

    maven {
        name = "BlameJared maven"
        url = "https://maven.blamejared.com/"
    }

    maven {
        name = "RyanLiptak Maven"
        url = "https://maven.ryanliptak.com/"
    }

    maven {
        name = "TerraformersMC Maven"
        url = "https://maven.terraformersmc.com/releases"
    }

    maven {
        name = "DevOS Maven (Snapshots)"
        url = "https://mvn.devos.one/snapshots/"
    }

    maven {
        name = "DevOS Maven (Releases)"
        url = "https://mvn.devos.one/releases/"
    }

    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    // Base
    minecraft("com.mojang:minecraft:${minecraft_version}")
    mappings(loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${mappings_channel_version}@zip")
    })

    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")

    // Dependencies (Mandatory)
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")
    modImplementation("com.mememan:nexus-fabric-${minecraft_version}:${nexus_version}")

    // Dependencies (Optional)
    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")

    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    modCompileOnly("squeek.appleskin:appleskin-fabric:${appleskin_version}:api") { transitive = false }

    modImplementation("com.terraformersmc:modmenu:${modmenu_version}")
}

loom {
    mods {
        mod_id {
            sourceSet sourceSets.main
        }
    }

    if (file("src/main/resources/${mod_id}.accessWidener").exists()) {
        accessWidenerPath.set(file("src/main/resources/${mod_id}.accessWidener"))
    }

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName("${fabric_client_taskname}")
            ideConfigGenerated(true)
            runDir("run/client")

            vmArg("-Dfabric.log.level=debug")

            vmArgs("-Xms12G", "-Xmx16G", "-XX:+UseG1GC", "-XX:+UnlockExperimentalVMOptions",
                    "-XX:MaxGCPauseMillis=100", "-XX:+DisableExplicitGC", "-XX:TargetSurvivorRatio=90",
                    "-XX:G1NewSizePercent=35", "-XX:G1MaxNewSizePercent=60", "-XX:G1MixedGCLiveThresholdPercent=50",
                    "-XX:+AlwaysPreTouch", "-Dmixin.debug.export=true")
        }
        server {
            server()
            serverWithGui()
            setConfigName("${fabric_server_taskname}")
            ideConfigGenerated(true)
            runDir("run/server")

            vmArg("-Dfabric.log.level=debug")

            vmArgs("-Xms12G", "-Xmx16G", "-XX:+UseG1GC", "-XX:+UnlockExperimentalVMOptions", "-XX:MaxGCPauseMillis=100",
                    "-XX:+DisableExplicitGC", "-XX:TargetSurvivorRatio=90", "-XX:G1NewSizePercent=35",
                    "-XX:G1MaxNewSizePercent=60", "-XX:G1MixedGCLiveThresholdPercent=50",
                    "-XX:+AlwaysPreTouch", "-Dmixin.debug.export=true")
        }
        datagen {
            inherit server
            setConfigName("${fabric_data_taskname}")

            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.output-dir=${file('src/generated/resources')}")
            vmArg("-Dfabric-api.datagen.modid=${mod_id}")
            vmArg("-Dfabric.log.level=debug")

            runDir("build/datagen")

            vmArgs("-Xms12G", "-Xmx16G", "-XX:+UseG1GC", "-XX:+UnlockExperimentalVMOptions", "-XX:MaxGCPauseMillis=100",
                    "-XX:+DisableExplicitGC", "-XX:TargetSurvivorRatio=90", "-XX:G1NewSizePercent=35",
                    "-XX:G1MaxNewSizePercent=60", "-XX:G1MixedGCLiveThresholdPercent=50", "-XX:+AlwaysPreTouch",
                    "-Dmixin.debug.export=true")
        }
    }
}

sourceSets.main.resources.srcDir(file("src/generated/resources"))

processResources {
    def props = new Properties()

    rootProject.file('gradle.properties').withInputStream { props.load(it) }

    // Filter out any non-String values and system properties
    def replaceProperties = [:]

    props.each { key, value ->
        if (value instanceof String) {
            replaceProperties.put(key, value)
        }
    }

    inputs.properties(replaceProperties)
    filesMatching(['fabric.mod.json', 'pack.mcmeta', '*.mixins.json']) {
        expand replaceProperties + [project: project]
    }

    exclude '**/.cache/'

    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.getRelease().set(17)
}

tasks.withType(Javadoc).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.addStringOption('Xdoclint', 'none')
    it.failOnError = false
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

publishMods {
    file = remapJar.archiveFile
    changelog = file("CHANGELOG.md").getText()
    version = mod_version
    displayName = "${mod_name} v${minecraft_version}-${mod_version} [Fabric]"
    type = STABLE

    modLoaders.add("fabric")

    curseforge {
        projectId = ""
        projectSlug = ""
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        announcementTitle = "New ${mod_name} CurseForge Release (Fabric) - v${mod_version} for MC ${minecraft_version}"
        clientRequired = true
        serverRequired = true

        getMinecraftVersions().add(minecraft_version)
        getJavaVersions().add(JavaVersion.VERSION_17)
        requires("fabric-api")
        requires("nexus-api")
    }

    modrinth {
        projectId = ""
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        announcementTitle = "New ${mod_name} Modrinth Release (Fabric) - v${mod_version} for MC ${minecraft_version}"

        getMinecraftVersions().add(minecraft_version)
        requires("fabric-api")
        requires("nexus-api")
    }
}

publishing {
    repositories {
        maven {
            name = "meme-man-mods"
            url = "https://maven.cloudsmith.io/meme-man-mods/blitz/"

            credentials {
                username = System.getenv("CLOUDSMITH_USERNAME")
                password = System.getenv("CLOUDSMITH_API_KEY")
            }
        }
    }

    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            version = mod_version
            group = mod_group

            from components.java
        }
    }
}